
<!doctype html>

<head>

<style>
:root{--bg:#080b12;--panel:#111722;--panel2:#182231;--line:#263246;--muted:#91a0b5;--text:#f4f7fb;--red:#ef3340;--green:#31d18b;--amber:#f4c15d;--blue:#58a6ff}*{box-sizing:border-box}body{margin:0;background:radial-gradient(ellipse at 15% 0,#28121a 0,transparent 35%),var(--bg);color:var(--text);font:14px Inter,ui-sans-serif,system-ui,-apple-system,Segoe UI,sans-serif}button,input,select,textarea{font:inherit}button{cursor:pointer;border:1px solid var(--line);background:#202c3d;color:var(--text);padding:10px 13px;border-radius:9px;font-weight:650}button:hover{filter:brightness(1.14)}button.primary{background:var(--red);border-color:var(--red)}button.good{background:#126b4b;border-color:#1b9568}button.warn{background:#765313;border-color:#a97920}button.danger{background:#70252c;border-color:#a53842}.shell{max-width:1450px;margin:auto;padding:22px}.top{display:flex;align-items:center;justify-content:space-between;gap:16px;margin-bottom:22px}.brand{display:flex;align-items:center;gap:12px}.mark{width:44px;height:44px;border-radius:13px;background:linear-gradient(145deg,#ff4c57,#9b1427);display:grid;place-items:center;font-weight:1000;font-size:18px;box-shadow:0 8px 28px #ef334033}.brand h1{font-size:16px;margin:0;letter-spacing:.12em}.brand small{color:var(--muted)}.status{display:flex;align-items:center;gap:8px;color:var(--muted);font-size:12px}.dot{width:8px;height:8px;border-radius:50%;background:#687386}.dot.on{background:var(--green);box-shadow:0 0 12px var(--green)}.tabs{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:16px}.tabs button.active{background:#3b202a;border-color:#9e3344;color:#fff}.layout{display:grid;grid-template-columns: minmax(0,1.3fr) minmax(320px,.7fr);gap:16px}.panel{background:linear-gradient(180deg,#141c29,#101621);border:1px solid var(--line);border-radius:15px;padding:17px;min-width:0}.panel h2{font-size:14px;margin:0 0 14px;letter-spacing:.08em;text-transform:uppercase}.panel h3{font-size:12px;color:#cbd5e1;margin:18px 0 9px;text-transform:uppercase;letter-spacing:.08em}.muted{color:var(--muted)}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.grid.three{grid-template-columns:repeat(3,minmax(0,1fr))}.field{display:flex;flex-direction:column;gap:6px;min-width:0}.field label{font-size:11px;color:var(--muted);font-weight:700;text-transform:uppercase;letter-spacing:.06em}.field input,.field select,.field textarea{width:100%;background:#0b111b;border:1px solid #2a374b;border-radius:8px;color:var(--text);padding:10px;outline:none}.field input:focus,.field select:focus,.field textarea:focus{border-color:var(--red)}.field textarea{min-height:75px;resize:vertical}.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}.row>*{flex:1}.row .fit{flex:0 0 auto}.sep{height:1px;background:var(--line);margin:15px 0}.scorecard{background:linear-gradient(110deg,#171d29,#25151d);border:1px solid #4a2933;border-radius:14px;padding:18px;margin-bottom:15px}.comp{text-align:center;color:#c0c9d6;font-size:11px;letter-spacing:.16em;text-transform:uppercase}.scoreline{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;gap:14px;margin:16px 0}.team{text-align:center;min-width:0}.team img{width:48px;height:48px;object-fit:contain;display:block;margin:0 auto 7px}.team b{font-size:13px}.score{font-size:36px;font-weight:900;letter-spacing:.05em;white-space:nowrap}.clock{text-align:center;color:#ff6973;font-weight:800;font-variant-numeric:tabular-nums}.eventlist{display:flex;flex-direction:column;gap:7px;max-height:260px;overflow:auto}.event{display:flex;align-items:center;gap:9px;background:#0c131e;border:1px solid #202d40;border-radius:9px;padding:9px}.event .min{color:var(--amber);font-weight:800;min-width:38px}.event small{color:var(--muted);margin-left:auto}.pill{font-size:10px;font-weight:800;border-radius:20px;padding:4px 8px;background:#263448;color:#cbd5e1}.actions{display:flex;gap:7px;flex-wrap:wrap}.actions button{flex:1;min-width:90px}.hidden{display:none!important}.notice{padding:10px 12px;border:1px solid #31533f;background:#10251e;border-radius:9px;color:#b7f5d7;margin:10px 0}.error{border-color:#78333b;background:#2b1519;color:#ffc3c8}.statrow{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;align-items:center;margin:8px 0}.statrow input{text-align:center}.statrow span{text-align:center;color:var(--muted);font-size:12px}.login{max-width:430px;margin:8vh auto}.login .panel{padding:25px}.adminonly{display:none}.previewbox{background:#070b11;border:1px dashed #46556a;border-radius:12px;padding:14px}.small{font-size:11px}.foot{color:#748197;font-size:11px;margin-top:18px;line-height:1.6}.toast{position:fixed;right:20px;bottom:20px;background:#162334;border:1px solid #40516a;border-radius:10px;padding:12px 16px;z-index:50;box-shadow:0 10px 35px #0008}.overlaybody{background:transparent;overflow:hidden}.broadcast{width:100%;padding:18px;color:white}.bug{width:min(850px,100%);margin:auto;background:linear-gradient(100deg,#111925f5,#28141bf5);border:1px solid #ffffff24;border-left:5px solid var(--red);border-radius:10px;box-shadow:0 12px 35px #0008;overflow:hidden}.bugtop{display:flex;justify-content:space-between;align-items:center;padding:7px 13px;background:#080d15d9;font-size:11px;letter-spacing:.13em}.liveflag{color:#ff6973;font-weight:900}.bugmain{display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:13px 18px;gap:15px}.obteam{text-align:center;font-size:14px;font-weight:800}.obteam img{height:35px;width:35px;object-fit:contain;vertical-align:middle;margin-right:7px}.obscore{font-size:34px;font-weight:950;letter-spacing:.08em}.obclock{text-align:center;color:#ff7880;font-size:12px;font-weight:800}.obfoot{padding:7px 13px;background:#080d15d9;display:flex;justify-content:space-between;font-size:11px;color:#d0d7e2}.alert{width:min(650px,95%);margin:18px auto 0;text-align:center;padding:17px;background:linear-gradient(110deg,#8e1424f2,#ed3340ed);border-radius:10px;box-shadow:0 10px 35px #0008;animation:pop .35s ease-out}.alert h1{font-size:30px;margin:0 0 5px;letter-spacing:.08em}.alert p{margin:0;font-weight:700}.alert.hide{display:none}@keyframes pop{from{transform:translateY(12px) scale(.96);opacity:0}to{transform:none;opacity:1}}.obstats{width:min(600px,95%);margin:12px auto;background:#111925ed;border-radius:9px;padding:12px}.obstat{display:grid;grid-template-columns:1fr 1.5fr 1fr;gap:8px;align-items:center;margin:7px 0;font-size:12px}.bar{height:5px;background:#334155;border-radius:8px;overflow:hidden}.bar i{display:block;height:100%;background:#ef3340}.momentum{width:min(650px,95%);margin:12px auto 0;padding:12px 16px;border:1px solid #ffffff30;border-left:5px solid var(--amber);border-radius:10px;background:linear-gradient(100deg,#101b2af2,#182638f2);box-shadow:0 10px 30px #0007;display:flex;align-items:center;gap:12px;animation:pop .25s ease-out}.momentum .pulse{width:10px;height:10px;border-radius:50%;background:var(--amber);box-shadow:0 0 0 0 #f4c15d99;animation:pulse 1.5s infinite}.momentum strong{font-size:15px;letter-spacing:.06em}.momentum small{display:block;color:#c3cedb;margin-top:3px}.momentum.dangerous{border-left-color:#ff4655}.momentum.dangerous .pulse{background:#ff4655;box-shadow:0 0 0 0 #ff465599}.momentum.attack{border-left-color:#31d18b}.momentum.attack .pulse{background:#31d18b;box-shadow:0 0 0 0 #31d18b99}.momentum.defend{border-left-color:#58a6ff}.momentum.defend .pulse{background:#58a6ff;box-shadow:0 0 0 0 #58a6ff99}@keyframes pulse{70%{box-shadow:0 0 0 9px transparent}100%{box-shadow:0 0 0 0 transparent}}.ticker{margin:12px auto 0;width:min(850px,100%);background:#0a111c;border-left:4px solid var(--red);padding:9px 13px;font-size:12px;white-space:nowrap;overflow:hidden}.ticker span{display:inline-block;min-width:100%;animation:scroll 22s linear infinite}@keyframes scroll{from{transform:translateX(100%)}to{transform:translateX(-100%)}}@media(max-width:850px){.layout{grid-template-columns:1fr}.shell{padding:13px}.top{align-items:flex-start}.grid.three{grid-template-columns:1fr 1fr}}@media(max-width:480px){.grid{grid-template-columns:1fr}.score{font-size:27px}.scoreline{gap:6px}.team b{font-size:11px}}
</style>

<body>
<div id="app"></div>
<script type="module">
import { initializeApp } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js';
import { getAuth, onAuthStateChanged, signInWithEmailAndPassword, signInAnonymously, signOut } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js';
import { getDatabase, ref, onValue, set, update, push, remove } from 'https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js';

// 1) Replace every value below with your own Firebase Web App configuration.
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyAZj8YDsN60dXXWqwf7crh1q66B7NlYSkY",
  authDomain: "arsenal-fans-live.firebaseapp.com",
  databaseURL: "https://arsenal-fans-live-default-rtdb.firebaseio.com",
  projectId: "arsenal-fans-live",
  storageBucket: "arsenal-fans-live.firebasestorage.app",
  messagingSenderId: "751029894045",
  appId: "1:751029894045:web:68744f98f15b3c2e708d74",
  measurementId: "G-G7QNWYDSVZ"
};
const configured = !Object.values(firebaseConfig).some(v => String(v).includes('YOUR_'));
const app = configured ? initializeApp(firebaseConfig) : null;
const auth = app ? getAuth(app) : null;
const db = app ? getDatabase(app) : null;
const matchRef = db ? ref(db,'matches/current') : null;
const appRoot = document.getElementById('app');
const params = new URLSearchParams(location.search);
const isOverlay = params.get('overlay') === '1';
const isFanZone = params.get('fans') === '1';
let fanUid = null, fanVotesUnsub = null, fanMatchUnsub = null, fanReactionsUnsub = null;
let currentUser = null, match = null, activeTab = 'match', unsubscribe = null, localClock = null;
const defaults = {
  competition:'YOUR TOURNAMENT',round:'MATCHDAY',venue:'',date:'',referee:'',
  home:{name:'HOME TEAM',short:'HOME',logo:'',color:'#ef3340'},away:{name:'AWAY TEAM',short:'AWAY',logo:'',color:'#64748b'},
  homeScore:0,awayScore:0,period:'Not started',minute:0,second:0,addedTime:0,running:false,clockStartedAt:null,
  players:[],events:[],ticker:'WELCOME TO THE LIVE MATCH',
  stats:{possessionHome:50,possessionAway:50,shotsHome:0,shotsAway:0,onTargetHome:0,onTargetAway:0,cornersHome:0,cornersAway:0,foulsHome:0,foulsAway:0,offsidesHome:0,offsidesAway:0,savesHome:0,savesAway:0,passesHome:0,passesAway:0,passAccuracyHome:0,passAccuracyAway:0},
  graphics:{scoreboard:true,events:true,stats:false,ticker:true,alert:true,teamNames:true,momentum:true},
  momentum:null,activeAlert:null,updatedAt:Date.now()
};
const clone = x => JSON.parse(JSON.stringify(x));
function esc(s=''){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function timeNow(m=match){if(!m)return '00:00';let sec=Number(m.second||0),min=Number(m.minute||0);if(m.running&&m.clockStartedAt){let elapsed=Math.max(0,Math.floor((Date.now()-m.clockStartedAt)/1000));sec+=elapsed;min+=Math.floor(sec/60);sec%=60;}return String(min).padStart(2,'0')+':'+String(sec).padStart(2,'0');}
function minuteLabel(){let t=timeNow().split(':');return t[1]==='00'?t[0]+"'":t.join(':');}
function toast(msg,bad=false){let el=document.createElement('div');el.className='toast'+(bad?' error':'');el.textContent=msg;document.body.append(el);setTimeout(()=>el.remove(),3200);}
function needAdmin(){if(!currentUser){toast('Please sign in as admin first.',true);return false;}return true;}
async function save(patch){if(!needAdmin())return;try{await update(matchRef,{...patch,updatedAt:Date.now()});}catch(e){toast(e.message,true);}}
async function saveWhole(next){if(!needAdmin())return;try{next.updatedAt=Date.now();await set(matchRef,next);}catch(e){toast(e.message,true);}}
function liveState(){if(!match)return clone(defaults);let m=clone(match);if(m.running&&m.clockStartedAt){let total=(Number(m.minute||0)*60+Number(m.second||0))+Math.max(0,Math.floor((Date.now()-m.clockStartedAt)/1000));m.minute=Math.floor(total/60);m.second=total%60;}return m;}
function clockPatch(running){let m=liveState();return save({minute:m.minute,second:m.second,running,clockStartedAt:running?Date.now():null});}
function eventObj(type,detail,team='home',extra={}){return {id:Date.now()+'_'+Math.random().toString(36).slice(2,7),type,detail,team,minute:minuteLabel(),createdAt:Date.now(),...extra};}
async function addEvent(type,detail,team='home',extra={}){let m=liveState(),events=[...(m.events||[]),eventObj(type,detail,team,extra)];let alert={type,detail,team,minute:minuteLabel(),createdAt:Date.now()};await save({events,activeAlert:alert});}
function teamName(side){return match?.[side]?.name||side.toUpperCase();}
function score(side){return Number(match?.[side+'Score']||0);}
function tabButton(id,label){return `<button class="${activeTab===id?'active':''}" data-tab="${id}">${label}</button>`;}
function field(label,id,value='',type='text',placeholder=''){return `<div class="field"><label for="${id}">${label}</label><input id="${id}" type="${type}" value="${esc(value)}" placeholder="${esc(placeholder)}"></div>`;}
function selectField(label,id,value,opts){return `<div class="field"><label>${label}</label><select id="${id}">${opts.map(x=>`<option ${x===value?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`;}
function adminShell(){appRoot.innerHTML=`<div class="shell"><header class="top"><div class="brand"><div class="mark">FL</div><div><h1>FANS LIVE <span style="color:var(--red)">STUDIO</span></h1><small>MANUAL FOOTBALL BROADCAST CONTROL</small></div></div><div class="status"><i class="dot ${match?'on':''}"></i><span>${match?'DATABASE CONNECTED':'CONNECTING'}</span><button id="logout" class="fit">Log out</button></div></header><nav class="tabs">${tabButton('match','Match control')}${tabButton('events','Events & moments')}${tabButton('momentum','Match momentum')}${tabButton('fans','Fan zone')}${tabButton('players','Players & lineups')}${tabButton('stats','Statistics')}${tabButton('graphics','Graphics & ticker')}${tabButton('preview','Preview')}</nav><div id="notice"></div><div id="tabContent"></div><p class="foot">Independent fan-made broadcast graphics. No official league affiliation. Use only logos, images, footage and audio you have permission to use. Keep this admin URL private; OBS should use the public overlay URL with ?overlay=1.</p></div>`;
appRoot.querySelectorAll('[data-tab]').forEach(b=>b.onclick=()=>{activeTab=b.dataset.tab;adminShell();});document.getElementById('logout').onclick=()=>signOut(auth);renderTab();}
function loginScreen(){appRoot.innerHTML=`<div class="login"><div class="brand" style="justify-content:center;margin-bottom:18px"><div class="mark">FL</div><div><h1>FANS LIVE STUDIO</h1><small>SECURE ADMIN ACCESS</small></div></div><section class="panel"><h2>Admin sign in</h2><p class="muted">Sign in with the administrator account created in Firebase Authentication.</p><div class="field"><label>Email</label><input id="email" type="email" autocomplete="username" placeholder="admin@example.com"></div><div class="field" style="margin-top:10px"><label>Password</label><input id="password" type="password" autocomplete="current-password" placeholder="Your password"></div><button id="login" class="primary" style="width:100%;margin-top:14px">Sign in to studio</button><div id="loginError"></div></section></div>`;document.getElementById('login').onclick=async()=>{let e=document.getElementById('email').value,p=document.getElementById('password').value;try{await signInWithEmailAndPassword(auth,e,p);}catch(err){document.getElementById('loginError').innerHTML=`<div class="notice error">${esc(err.message)}</div>`;}};}
function renderTab(){let el=document.getElementById('tabContent');if(!el)return;switch(activeTab){case'match':el.innerHTML=matchTab();break;case'events':el.innerHTML=eventsTab();break;case'momentum':el.innerHTML=momentumTab();break;case'fans':el.innerHTML=fansAdminTab();break;case'players':el.innerHTML=playersTab();break;case'stats':el.innerHTML=statsTab();break;case'graphics':el.innerHTML=graphicsTab();break;case'preview':el.innerHTML=previewTab();break;}bindTab();}
function matchTab(){let m=match||clone(defaults);return `<div class="layout"><section class="panel"><h2>Match identity</h2><div class="grid">${field('Competition / tournament','competition',m.competition)}${field('Round / stage','round',m.round)}${field('Venue','venue',m.venue)}${field('Match date','date',m.date,'date')}${field('Referee','referee',m.referee)}${selectField('Match period','period',m.period,['Not started','1st Half','Half-time','2nd Half','Extra time','Half-time in extra time','Penalties','Full-time','Abandoned'])}</div><div class="sep"></div><h3>Home team</h3><div class="grid">${field('Team name','homeName',m.home.name)}${field('Short name','homeShort',m.home.short)}${field('Logo image URL','homeLogo',m.home.logo)}${field('Team colour','homeColor',m.home.color,'color')}</div><h3>Away team</h3><div class="grid">${field('Team name','awayName',m.away.name)}${field('Short name','awayShort',m.away.short)}${field('Logo image URL','awayLogo',m.away.logo)}${field('Team colour','awayColor',m.away.color,'color')}</div><div class="actions" style="margin-top:15px"><button class="primary" id="saveMatch">Save match information</button><button id="newMatch">Reset / new match</button></div></section><section class="panel"><h2>Live match controls</h2><div class="scorecard"><div class="comp">${esc(m.competition)} · ${esc(m.round)}</div><div class="scoreline"><div class="team"><img src="${esc(m.home.logo||'')}" onerror="this.style.display='none'"><b>${esc(m.home.short||m.home.name)}</b></div><div><div class="score">${score('home')} – ${score('away')}</div><div class="clock">${timeNow()} · ${esc(m.period)}</div></div><div class="team"><img src="${esc(m.away.logo||'')}" onerror="this.style.display='none'"><b>${esc(m.away.short||m.away.name)}</b></div></div><div class="comp">${esc(m.venue||'Venue not set')}</div></div><div class="grid"><div><h3>Score · ${esc(m.home.short)}</h3><div class="actions"><button id="homeMinus">−</button><button class="good" id="homePlus">+ Goal</button></div></div><div><h3>Score · ${esc(m.away.short)}</h3><div class="actions"><button id="awayMinus">−</button><button class="good" id="awayPlus">+ Goal</button></div></div></div><h3>Match clock</h3><div class="grid three">${field('Minute','clockMinute',m.minute,'number')}${field('Seconds','clockSecond',m.second,'number')}${field('Added time','addedTime',m.addedTime,'number')}</div><div class="actions" style="margin-top:10px"><button class="good" id="clockStart">Start / Resume</button><button id="clockPause">Pause</button><button id="clockSet">Set time</button><button class="warn" id="clockReset">Reset clock</button></div><div class="actions" style="margin-top:10px"><button id="undo">Undo last event</button><button class="danger" id="resetScore">Reset scores</button></div></section></div>`;}
function eventsTab(){return `<div class="layout"><section class="panel"><h2>Create live event</h2><div class="grid">${selectField('Event type','eventType','Goal',['Goal','Own goal','Penalty scored','Penalty missed','Penalty awarded','Yellow card','Second yellow / red','Straight red card','Substitution','VAR check','VAR decision','Injury','Kick-off','Half-time','Full-time','Extra time','Missed chance','Custom moment'])}${selectField('Team','eventTeam','home',['home','away'])}${field('Player / headline','eventPlayer','','text','Player name or event title')}${field('Assist / second player','eventAssist','','text','Optional')}${field('Match minute','eventMinute',minuteLabel())}${field('Extra description','eventDescription','','text','Optional details')}</div><div class="actions" style="margin-top:13px"><button class="primary" id="publishEvent">Publish event + on-screen alert</button></div><div class="sep"></div><h3>Quick notifications</h3><div class="actions"><button id="quickGoal" class="good">⚽ Goal</button><button id="quickYellow" class="warn">🟨 Yellow card</button><button id="quickRed" class="danger">🟥 Red card</button><button id="quickVar">VAR</button><button id="quickCustom">Custom alert</button></div></section><section class="panel"><h2>Match event timeline</h2><div class="eventlist">${(match.events||[]).slice().reverse().map(e=>`<div class="event"><span class="min">${esc(e.minute||'')}</span><span>${eventIcon(e.type)} ${esc(e.type)}</span><span>${esc(e.detail||'')}</span><small>${esc(teamName(e.team||'home'))}</small><button data-delete-event="${esc(e.id)}" class="fit danger">×</button></div>`).join('')||'<p class="muted">No events recorded yet.</p>'}</div><div class="actions" style="margin-top:12px"><button id="clearEvents" class="danger">Clear event timeline</button><button id="clearAlert">Clear active alert</button></div></section></div>`;}
function momentumTab(){let x=match.momentum||{};return `<div class="layout"><section class="panel"><h2>Live match momentum</h2><p class="muted">Manually publish what is happening on the pitch. Choose the team and moment; it appears on the OBS overlay in real time.</p><div class="grid">${selectField('Team in control','momentumTeam',x.team||'home',['home','away'])}${selectField('Pitch moment','momentumType',x.label||'Dangerous Attack',['Dangerous Attack','Attacking','Defending','Counter Attack','High Press','Possession','Building Attack','Chance Created','Big Chance','Set Piece','Corner Pressure','Goal Threat','Under Pressure','Break in Play'])}${field('Short detail (optional)','momentumDetail',x.detail||'','text','e.g. Driving forward down the left flank')}</div><div class="actions" style="margin-top:14px"><button class="primary" id="publishMomentum">Publish pitch moment</button><button id="clearMomentum" class="danger">Clear momentum</button></div><div class="sep"></div><h3>Quick pitch buttons</h3><div class="actions">${['Dangerous Attack','Attacking','Defending','Counter Attack','High Press','Goal Threat','Possession','Under Pressure'].map((t,i)=>`<button data-momentum="${t}" class="${i===0?'danger':i===1?'good':i===2?'':' '}">${t}</button>`).join('')}</div></section><section class="panel"><h2>On-air momentum preview</h2><div class="previewbox">${x.label?momentumMarkup(x,match):'<p class="muted">No pitch moment is currently on air.</p>'}</div><p class="foot">These are manual editorial labels, not automatic tracking or official live match statistics. Update them when the action changes.</p></section></div>`;}
function fansAdminTab(){let p=match.fanPoll||{};return `<div class="layout"><section class="panel"><h2>Viewer interaction studio</h2><p class="muted">Publish a live poll that viewers can answer from your public Fan Zone page. Each anonymous Firebase account gets one current vote per poll.</p><div class="field"><label>Poll question</label><input id="fanPollQuestion" value="${esc(p.question||'Who will win this match?')}" placeholder="Who will win this match?"></div><div class="grid" style="margin-top:10px"><div class="field"><label>Option 1</label><input id="fanOpt1" value="${esc(p.options?.[0]||match.home.name)}"></div><div class="field"><label>Option 2</label><input id="fanOpt2" value="${esc(p.options?.[1]||'Draw')}"></div><div class="field"><label>Option 3</label><input id="fanOpt3" value="${esc(p.options?.[2]||match.away.name)}"></div></div><div class="actions" style="margin-top:13px"><button class="primary" id="publishFanPoll">Publish new poll</button><button class="danger" id="closeFanPoll">Close poll</button></div><div class="sep"></div><h3>Viewer page</h3><p class="muted">Share this link with viewers so they can vote and react while watching your stream.</p><div class="field"><input id="fanUrl" readonly value="${esc(location.origin+location.pathname+'?fans=1')}"></div><div class="actions" style="margin-top:9px"><button id="copyFanUrl">Copy Fan Zone link</button><button id="openFanUrl">Open Fan Zone</button></div></section><section class="panel"><h2>Audience experience</h2><div class="previewbox"><div class="comp">${esc(match.competition)} · FAN ZONE</div><h2 style="text-align:center;margin:15px 0">${esc(p.question||'Your live fan poll will appear here')}</h2>${(p.options||[match.home.name,'Draw',match.away.name]).map((o,i)=>`<div class="event"><b>${i+1}.</b> ${esc(o)}</div>`).join('')}<p class="muted small">Viewers can vote and send live reactions. Results are visible in the Fan Zone.</p></div><p class="foot">Viewer votes are stored separately from the official match score. Do not use polls to claim an official result.</p></section></div>`;}
function momentumMarkup(x,m){if(!x||!x.label)return '';let tone=/dangerous|big chance|goal threat/i.test(x.label)?'dangerous':/defend|under pressure/i.test(x.label)?'defend':'attack';let side=x.team==='away'?'away':'home';return `<div class="momentum ${tone}"><i class="pulse"></i><div><strong>${esc(x.label).toUpperCase()}</strong><small>${esc(m?.[side]?.name||side.toUpperCase())}${x.detail?' · '+esc(x.detail):''}${x.minute?' · '+esc(x.minute):''}</small></div></div>`;}
function eventIcon(t){return ({Goal:'⚽','Own goal':'⚽','Penalty scored':'⚽','Penalty missed':'❌','Penalty awarded':'⚖️','Yellow card':'🟨','Second yellow / red':'🟥','Straight red card':'🟥',Substitution:'🔄','VAR check':'📺','VAR decision':'📺',Injury:'🚑','Kick-off':'▶️','Half-time':'⏸️','Full-time':'🏁'})[t]||'📣';}
function playersTab(){let players=match.players||[];return `<div class="layout"><section class="panel"><h2>Player / squad manager</h2><div class="grid">${selectField('Team','playerTeam','home',['home','away'])}${field('Player name','playerName','','text','Full name')}${field('Shirt number','playerNumber','','number')}${selectField('Position','playerPosition','Midfielder',['Goalkeeper','Defender','Midfielder','Forward'])}${field('Photo URL','playerPhoto','','url','Optional image URL')}${selectField('Squad status','playerStatus','Starter',['Starter','Substitute','Not selected'])}</div><button id="addPlayer" class="primary" style="margin-top:12px">Add player to squad</button><div class="sep"></div><h3>Starting XI / lineup graphic</h3><div class="actions"><button id="showLineup" class="good">Show lineup alert</button><button id="hideLineup">Hide lineup graphic</button></div></section><section class="panel"><h2>Squad list · ${players.length} players</h2><div class="eventlist">${players.map(p=>`<div class="event"><b>${esc(p.number||'')}</b><span>${esc(p.name)}</span><small>${esc(p.team)} · ${esc(p.position)} · ${esc(p.status)}</small><button data-del-player="${esc(p.id)}" class="fit danger">×</button></div>`).join('')||'<p class="muted">Add players to build your team squads.</p>'}</div><div class="sep"></div><h3>Quick substitution</h3><div class="grid">${field('Player coming IN','subIn','','text','Player IN')}${field('Player going OUT','subOut','','text','Player OUT')}</div><div class="actions" style="margin-top:10px"><button id="publishSub" class="primary">Publish substitution</button></div></section></div>`;}
const statDefs=[['Possession','possession','%'],['Shots','shots',''],['Shots on target','onTarget',''],['Corners','corners',''],['Fouls','fouls',''],['Offsides','offsides',''],['Saves','saves',''],['Passes','passes',''],['Pass accuracy','passAccuracy','%']];
function statsTab(){let s=match.stats||defaults.stats;return `<section class="panel"><h2>Live match statistics</h2><p class="muted">Edit both team values and publish. These values appear in the OBS statistics graphic when enabled.</p><div class="statrow"><span>HOME · ${esc(match.home.short)}</span><b style="text-align:center">STATISTIC</b><span>AWAY · ${esc(match.away.short)}</span></div>${statDefs.map(([label,key,suffix])=>`<div class="statrow"><input id="stat_${key}Home" type="number" min="0" max="100" value="${Number(s[key+'Home']||0)}"><span>${label}${suffix?' ('+suffix+')':''}</span><input id="stat_${key}Away" type="number" min="0" max="100" value="${Number(s[key+'Away']||0)}"></div>`).join('')}<div class="actions" style="margin-top:16px"><button id="saveStats" class="primary">Publish statistics</button><button id="toggleStats">Show / hide stats graphic</button></div></section>`;}
function graphicsTab(){let g=match.graphics||defaults.graphics;return `<div class="layout"><section class="panel"><h2>On-screen graphics</h2>${[['scoreboard','Main scoreboard'],['events','Event timeline'],['stats','Statistics panel'],['ticker','Scrolling ticker'],['alert','Event notifications'],['teamNames','Team names'],['momentum','Pitch momentum']].map(([k,l])=>`<div class="row" style="justify-content:space-between;margin:12px 0"><span>${l}</span><label><input type="checkbox" id="gfx_${k}" ${g[k]?'checked':''}> Show</label></div>`).join('')}<button id="saveGraphics" class="primary" style="margin-top:12px">Save graphic visibility</button></section><section class="panel"><h2>Broadcast ticker & custom alert</h2><div class="field"><label>Scrolling ticker text</label><textarea id="tickerText">${esc(match.ticker||'')}</textarea></div><button id="saveTicker" class="primary" style="margin-top:10px">Update ticker</button><div class="sep"></div><div class="field"><label>Custom alert headline</label><input id="customHeadline" placeholder="BREAKING TEAM NEWS"></div><div class="field" style="margin-top:9px"><label>Alert message</label><textarea id="customMessage" placeholder="Type your on-screen message"></textarea></div><button id="publishCustom" class="good" style="margin-top:10px">Show custom alert</button><div class="sep"></div><div class="field"><label>Alert duration (seconds)</label><input id="alertDuration" type="number" value="8" min="2" max="60"></div></section></div>`;}
function previewTab(){return `<section class="panel"><h2>Broadcast preview</h2><p class="muted">This preview uses the same live Firebase match data as the OBS overlay.</p><div class="previewbox"><div class="scorecard"><div class="comp">${esc(match.competition)} · ${esc(match.round)}</div><div class="scoreline"><div class="team"><img src="${esc(match.home.logo||'')}" onerror="this.style.display='none'"><b>${esc(match.home.name)}</b></div><div><div class="score">${score('home')} – ${score('away')}</div><div class="clock">${timeNow()} · ${esc(match.period)}</div></div><div class="team"><img src="${esc(match.away.logo||'')}" onerror="this.style.display='none'"><b>${esc(match.away.name)}</b></div></div></div><div class="eventlist">${(match.events||[]).slice(-5).reverse().map(e=>`<div class="event"><span class="min">${esc(e.minute)}</span>${eventIcon(e.type)} ${esc(e.type)} — ${esc(e.detail)}</div>`).join('')}</div></div><div class="actions" style="margin-top:14px"><button class="primary" id="openOverlay">Open OBS overlay</button><button id="copyOverlay">Copy overlay URL</button></div><p class="foot">Overlay URL: ${esc(location.origin+location.pathname+'?overlay=1')}</p></section>`;}
function bindTab(){const $=id=>document.getElementById(id);const val=id=>$(id)?.value??'';const on=(id,fn)=>{if($(id))$(id).onclick=fn;};
 on('saveMatch',()=>{let m=liveState();m.competition=val('competition');m.round=val('round');m.venue=val('venue');m.date=val('date');m.referee=val('referee');m.period=val('period');m.home={...m.home,name:val('homeName'),short:val('homeShort'),logo:val('homeLogo'),color:val('homeColor')};m.away={...m.away,name:val('awayName'),short:val('awayShort'),logo:val('awayLogo'),color:val('awayColor')};saveWhole(m);toast('Match information saved.');});
 on('newMatch',()=>{if(confirm('Start a new match? This replaces the current match data.'))saveWhole(clone(defaults));});
 on('homePlus',()=>save({homeScore:score('home')+1}));on('awayPlus',()=>save({awayScore:score('away')+1}));on('homeMinus',()=>save({homeScore:Math.max(0,score('home')-1)}));on('awayMinus',()=>save({awayScore:Math.max(0,score('away')-1)}));
 on('clockStart',()=>clockPatch(true));on('clockPause',()=>clockPatch(false));on('clockSet',()=>save({minute:Math.max(0,Number(val('clockMinute'))),second:Math.min(59,Math.max(0,Number(val('clockSecond')))),running:false,clockStartedAt:null,addedTime:Number(val('addedTime'))||0}));on('clockReset',()=>save({minute:0,second:0,running:false,clockStartedAt:null}));on('resetScore',()=>save({homeScore:0,awayScore:0}));
 on('undo',async()=>{let m=liveState(),ev=m.events||[],last=ev.pop();if(!last){toast('No event to undo.',true);return;}let patch={events:ev,activeAlert:null};if(['Goal','Own goal','Penalty scored'].includes(last.type)){let key=last.team+'Score';patch[key]=Math.max(0,Number(m[key]||0)-1);}await save(patch);});
 on('publishEvent',async()=>{let type=val('eventType'),team=val('eventTeam'),player=val('eventPlayer'),assist=val('eventAssist'),desc=val('eventDescription'),minute=val('eventMinute')||minuteLabel();if(!player&&!desc){toast('Enter a player or event description.',true);return;}let detail=[player,assist?'Assist: '+assist:'',desc].filter(Boolean).join(' · ');let m=liveState(),patch={events:[...(m.events||[]),eventObj(type,detail,team,{minute})],activeAlert:{type,detail,team,minute,createdAt:Date.now()}};if(['Goal','Own goal','Penalty scored'].includes(type))patch[team+'Score']=Number(m[team+'Score']||0)+1;await save(patch);toast(type+' published to broadcast.');});
 const quick=(type)=>{let team=$('eventTeam')?.value||'home',player=$('eventPlayer')?.value||prompt('Player name / alert text:')||'';if(!player)return;let m=liveState(),detail=player,ev=eventObj(type,detail,team);let patch={events:[...(m.events||[]),ev],activeAlert:{type,detail,team,minute:ev.minute,createdAt:Date.now()}};if(type==='Goal')patch[team+'Score']=Number(m[team+'Score']||0)+1;save(patch);};
 on('quickGoal',()=>quick('Goal'));on('quickYellow',()=>quick('Yellow card'));on('quickRed',()=>quick('Straight red card'));on('quickVar',()=>quick('VAR check'));on('quickCustom',()=>quick('Custom moment'));
 document.querySelectorAll('[data-delete-event]').forEach(b=>b.onclick=()=>{let ev=(match.events||[]).filter(e=>e.id!==b.dataset.deleteEvent);save({events:ev});});on('clearEvents',()=>{if(confirm('Delete all match events?'))save({events:[]});});on('clearAlert',()=>save({activeAlert:null}));
 on('addPlayer',async()=>{let name=val('playerName').trim();if(!name){toast('Enter a player name.',true);return;}let m=liveState();m.players=[...(m.players||[]),{id:Date.now()+'',name,number:val('playerNumber'),position:val('playerPosition'),photo:val('playerPhoto'),status:val('playerStatus'),team:val('playerTeam')}];await save({players:m.players});toast('Player added.');});document.querySelectorAll('[data-del-player]').forEach(b=>b.onclick=()=>save({players:(match.players||[]).filter(p=>p.id!==b.dataset.delPlayer)}));
 on('publishSub',()=>{let incoming=val('subIn').trim(),outgoing=val('subOut').trim();if(!incoming||!outgoing){toast('Enter both players.',true);return;}addEvent('Substitution',`IN: ${incoming} · OUT: ${outgoing}`, 'home');});on('showLineup',()=>addEvent('Starting XI','Starting lineup graphic requested','home'));on('hideLineup',()=>save({activeAlert:null}));
 on('saveStats',()=>{let s={...match.stats};for(let [label,key] of statDefs){s[key+'Home']=Number(val('stat_'+key+'Home'))||0;s[key+'Away']=Number(val('stat_'+key+'Away'))||0;}save({stats:s});toast('Statistics published.');});on('toggleStats',()=>save({graphics:{...match.graphics,stats:!match.graphics?.stats}}));
 on('saveGraphics',()=>{let g={};['scoreboard','events','stats','ticker','alert','teamNames','momentum'].forEach(k=>g[k]=$('gfx_'+k).checked);save({graphics:g});});on('saveTicker',()=>save({ticker:val('tickerText')}));
 on('publishMomentum',()=>{let team=val('momentumTeam'),label=val('momentumType'),detail=val('momentumDetail').trim(),minute=minuteLabel();save({momentum:{team,label,detail,minute,createdAt:Date.now()}});toast('Pitch moment published to OBS.');});
 on('publishFanPoll',()=>{let question=val('fanPollQuestion').trim(),options=[val('fanOpt1').trim(),val('fanOpt2').trim(),val('fanOpt3').trim()];if(!question||options.some(x=>!x)){toast('Enter a question and all three options.',true);return;}save({fanPoll:{id:Date.now()+'',question,options,open:true,createdAt:Date.now()}});toast('New viewer poll published.');});on('closeFanPoll',()=>save({fanPoll:{...(match.fanPoll||{}),open:false}}));on('copyFanUrl',async()=>{await navigator.clipboard.writeText(val('fanUrl'));toast('Fan Zone link copied.');});on('openFanUrl',()=>window.open(val('fanUrl'),'_blank'));
 on('clearMomentum',()=>save({momentum:null}));document.querySelectorAll('[data-momentum]').forEach(b=>b.onclick=()=>{let team=val('momentumTeam')||'home';save({momentum:{team,label:b.dataset.momentum,detail:'',minute:minuteLabel(),createdAt:Date.now()}});toast(b.dataset.momentum+' published.');});on('publishCustom',()=>{let detail=val('customHeadline')+(val('customMessage')?' — '+val('customMessage'):'');if(!val('customHeadline')&&!val('customMessage'))return toast('Enter an alert message.',true);addEvent('Custom alert',detail);});
 on('openOverlay',()=>window.open(location.href.split('?')[0]+'?overlay=1','_blank'));on('copyOverlay',async()=>{await navigator.clipboard.writeText(location.href.split('?')[0]+'?overlay=1');toast('Overlay URL copied.');});
}
function fanZoneShell(){document.body.className='';document.body.style.background='radial-gradient(ellipse at 20% 0,#35131e 0,transparent 40%),#080b12';appRoot.innerHTML=`<main class="shell" style="max-width:900px"><header class="top"><div class="brand"><div class="mark">FL</div><div><h1>FANS LIVE <span style="color:var(--red)">FAN ZONE</span></h1><small>YOUR MATCH. YOUR VOICE.</small></div></div><span class="pill">LIVE COMMUNITY</span></header><div id="fanContent"><section class="panel"><h2>Connecting to the live match…</h2></section></div><p class="foot">Fan-made interactive experience. Votes and reactions are for entertainment and do not affect the official match score.</p></main>`;}
function renderFanZone(m,votes={},reactions={}){let el=document.getElementById('fanContent');if(!el)return;let p=m.fanPoll||{},counts=(p.options||[]).map((o,i)=>({o,n:Object.values(votes||{}).filter(v=>v===String(i)).length})),total=counts.reduce((a,x)=>a+x.n,0);let myVote=fanUid?(votes||{})[fanUid]:null;let reactionCounts=['🔥','👏','⚽','❤️'].map(r=>({r,n:Object.values(reactions||{}).filter(x=>x?.reaction===r).length}));el.innerHTML=`<section class="scorecard"><div class="comp">${esc(m.competition||'LIVE MATCH')} · ${esc(m.round||'')}</div><div class="scoreline"><div class="team"><b>${esc(m.home?.name||'Home')}</b></div><div style="text-align:center"><div class="score">${Number(m.homeScore||0)} – ${Number(m.awayScore||0)}</div><div class="clock">${esc(timeNow(m))} · ${esc(m.period||'')}</div></div><div class="team"><b>${esc(m.away?.name||'Away')}</b></div></div></section><section class="panel"><h2>🎯 Fan prediction</h2>${p.open?`<h3 style="font-size:18px;text-transform:none;letter-spacing:0">${esc(p.question||'Who will win?')}</h3><div class="grid">${(p.options||[]).map((o,i)=>{let n=counts[i]?.n||0,pct=total?Math.round(n/total*100):0;return `<button data-fan-vote="${i}" class="${String(i)===myVote?'primary':''}" style="text-align:left;min-height:54px"><div style="display:flex;justify-content:space-between;gap:8px"><b>${esc(o)}</b><span>${pct}%</span></div><div style="height:5px;background:#334155;border-radius:8px;margin-top:9px;overflow:hidden"><i style="display:block;width:${pct}%;height:100%;background:#ef3340"></i></div><small>${n} votes</small></button>`;}).join('')}</div><p class="muted small">${myVote!==null&&myVote!==undefined?'Your vote is recorded. You can change it while the poll is open.':'Choose your prediction. Results update live.'} Total votes: ${total}</p>`:`<p class="muted">There is no open poll right now. Check back during the match.</p>`}</section><section class="panel" style="margin-top:14px"><h2>⚡ Send a fan reaction</h2><p class="muted">Choose your reaction to the action on the pitch.</p><div class="actions">${reactionCounts.map(x=>`<button data-fan-reaction="${x.r}" style="font-size:22px;min-height:58px">${x.r} <small>${x.n}</small></button>`).join('')}</div><p class="small muted">One current reaction per viewer; you can change it anytime.</p></section><section class="panel" style="margin-top:14px"><h2>Match moments</h2>${(m.events||[]).slice(-6).reverse().map(e=>`<div class="event"><b class="min">${esc(e.minute)}</b><span>${eventIcon(e.type)} ${esc(e.type)} · ${esc(e.detail)}</span></div>`).join('')||'<p class="muted">Match events will appear here.</p>'}</section>`;el.querySelectorAll('[data-fan-vote]').forEach(b=>b.onclick=async()=>{if(!fanUid)return toast('Connecting your viewer session. Try again.',true);try{await set(ref(db,`fanVotes/current/${p.id}/${fanUid}`),b.dataset.fanVote);}catch(e){toast('Vote not accepted: '+e.message,true);}});el.querySelectorAll('[data-fan-reaction]').forEach(b=>b.onclick=async()=>{if(!fanUid)return;try{await set(ref(db,`fanReactions/current/${fanUid}`),{reaction:b.dataset.fanReaction,at:Date.now()});}catch(e){toast('Reaction not accepted: '+e.message,true);}});}
async function startFanZone(){fanZoneShell();try{const cred=await signInAnonymously(auth);fanUid=cred.user.uid;fanMatchUnsub=onValue(matchRef,s=>{let m=s.val()||clone(defaults);match=m;let p=m.fanPoll||{};if(fanVotesUnsub){fanVotesUnsub();fanVotesUnsub=null;}fanVotesUnsub=onValue(ref(db,`fanVotes/current/${p.id||'none'}`),v=>{fanVotesCache=v.val()||{};renderFanZone(match,fanVotesCache,fanReactionsCache);});renderFanZone(m,fanVotesCache,fanReactionsCache);});fanReactionsUnsub=onValue(ref(db,'fanReactions/current'),s=>{fanReactionsCache=s.val()||{};if(match)renderFanZone(match,fanVotesCache,fanReactionsCache);});}catch(e){document.getElementById('fanContent').innerHTML=`<section class="panel"><h2>Fan Zone unavailable</h2><p>${esc(e.message)}</p><p class="muted">Ask the administrator to enable Anonymous sign-in in Firebase Authentication.</p></section>`;}}
let fanVotesCache={},fanReactionsCache={};
function overlayRender(){document.body.className='overlaybody';appRoot.innerHTML='<div class="broadcast" id="broadcast"></div>';renderOverlay();}
function renderOverlay(){let el=document.getElementById('broadcast');if(!el||!match)return;let m=liveState(),g=m.graphics||defaults.graphics,a=m.activeAlert;let alertVisible=g.alert&&a&&Date.now()-Number(a.createdAt||0)<15000;let stats=m.stats||defaults.stats;el.innerHTML=`${g.scoreboard?`<section class="bug"><div class="bugtop"><span>${esc(m.competition)} · ${esc(m.round)}</span><span class="liveflag">● LIVE</span></div><div class="bugmain"><div class="obteam">${m.home.logo?`<img src="${esc(m.home.logo)}">`:''}${g.teamNames?esc(m.home.short||m.home.name):''}</div><div style="text-align:center"><div class="obscore">${Number(m.homeScore||0)} <span style="color:#9aa7b8">–</span> ${Number(m.awayScore||0)}</div><div class="obclock">${timeNow()} · ${esc(m.period)}</div></div><div class="obteam">${m.away.logo?`<img src="${esc(m.away.logo)}">`:''}${g.teamNames?esc(m.away.short||m.away.name):''}</div></div><div class="obfoot"><span>${esc(m.venue||'')}</span><span>${esc(m.date||'')}</span></div></section>`:''}${g.momentum!==false&&m.momentum?momentumMarkup(m.momentum,m):''}${alertVisible?`<section class="alert"><h1>${esc(a.type==='Goal'?'GOOOAL!':a.type.toUpperCase())}</h1><p>${esc(a.detail)} · ${esc(a.minute||'')}</p></section>`:''}${g.stats?`<section class="obstats"><div style="text-align:center;font-size:11px;letter-spacing:.15em;margin-bottom:9px">MATCH STATISTICS</div>${statDefs.slice(0,7).map(([label,key])=>{let h=Number(stats[key+'Home']||0),v=Number(stats[key+'Away']||0),sum=h+v||1;return `<div class="obstat"><b>${h}${key==='possession'||key==='passAccuracy'?'%':''}</b><div><div style="display:flex;justify-content:space-between;margin-bottom:4px"><span>${label}</span><span>${v}${key==='possession'||key==='passAccuracy'?'%':''}</span></div><div class="bar"><i style="width:${100*h/sum}%"></i></div></div><b style="text-align:right">${v}${key==='possession'||key==='passAccuracy'?'%':''}</b></div>`;}).join('')}</section>`:''}${g.events&&(m.events||[]).length?`<section class="obstats"><div style="font-size:11px;letter-spacing:.12em;margin-bottom:7px">MATCH MOMENTS</div>${m.events.slice(-3).reverse().map(e=>`<div style="display:flex;gap:9px;padding:5px 0;font-size:12px"><b style="color:#ffc45e">${esc(e.minute)}</b><span>${eventIcon(e.type)} ${esc(e.type)} · ${esc(e.detail)}</span></div>`).join('')}</section>`:''}${g.ticker&&m.ticker?`<div class="ticker"><span>${esc(m.ticker)}</span></div>`:''}`;}
function start(){if(!configured){appRoot.innerHTML=`<div class="login"><section class="panel"><h2>Firebase configuration required</h2><p class="muted">Open index.html and replace the YOUR_ placeholder values in firebaseConfig with the real values from Firebase Project settings → Your apps → Config. Also set databaseURL to the exact Realtime Database URL.</p><p class="small muted">Do not share your admin password. The Firebase web config is intended for client-side use; protect data with the database rules described in README.md.</p></section></div>`;return;}
 if(isFanZone){startFanZone();return;}
 if(isOverlay){onAuthStateChanged(auth,()=>{onValue(matchRef,s=>{match=s.val()||clone(defaults);overlayRender();});});return;}
 onAuthStateChanged(auth,user=>{currentUser=user;if(!user){if(unsubscribe){unsubscribe();unsubscribe=null;}loginScreen();return;}if(!unsubscribe)unsubscribe=onValue(matchRef,s=>{match=s.val()||clone(defaults);if(!s.exists())set(matchRef,match);adminShell();});});setInterval(()=>{if(isOverlay)renderOverlay();else if(match&&activeTab==='match'){let c=document.querySelector('.clock');if(c)c.textContent=timeNow()+' · '+match.period;}},500);
}
start();
</script>
