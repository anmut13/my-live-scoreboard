
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Arsenal Fans Live</title>
<style>
:root {
  --red:#e31b23;
  --dark:#101116;
  --panel:#1b1d25;
  --white:#fff;
}
* {box-sizing:border-box}
body {
  margin:0;
  background:transparent;
  color:var(--white);
  font-family:Arial,sans-serif;
}
#overlay {
  max-width:1050px;
  margin:25px auto;
  overflow:hidden;
  border:1px solid #555;
  border-radius:15px;
  background:linear-gradient(110deg,#15151c,#29232a,#15151c);
  box-shadow:0 12px 35px #0008;
}
.brand {
  display:flex;
  align-items:center;
  justify-content:center;
  gap:12px;
  padding:12px;
  background:linear-gradient(90deg,#850b13,var(--red),#850b13);
  font-weight:900;
  letter-spacing:2px;
}
.shield {
  width:35px;height:39px;
  display:grid;place-items:center;
  background:white;color:#b20f19;
  clip-path:polygon(0 0,100% 0,100% 72%,50% 100%,0 72%);
  font-weight:900;
}
.competition {
  text-align:center;
  padding:10px;
  color:#ddd;
  font-size:12px;
  letter-spacing:2px;
}
.match {
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:15px;
  padding:25px 15px;
}
.team {text-align:center;min-width:0}
.team-name {
  font-size:clamp(18px,4vw,36px);
  font-weight:900;
  overflow:hidden;
  text-overflow:ellipsis;
  white-space:nowrap;
}
.score {
  display:flex;
  gap:16px;
  align-items:center;
  justify-content:center;
  font-size:clamp(45px,9vw,85px);
  font-weight:900;
  font-variant-numeric:tabular-nums;
}
.score span {transition:transform .25s}
.score .changed {animation:pop .45s}
@keyframes pop {
  50% {transform:scale(1.3);color:#ff4545}
}
.center {text-align:center;min-width:100px}
.clock {
  font-size:25px;
  font-weight:900;
  font-variant-numeric:tabular-nums;
}
.period {
  margin-top:8px;
  display:inline-block;
  padding:6px 12px;
  border-radius:5px;
  background:var(--red);
  font-size:11px;
  font-weight:900;
}
.bottom {
  display:flex;
  justify-content:space-between;
  gap:10px;
  padding:10px 15px;
  background:#ffffff12;
  font-size:11px;
  letter-spacing:1px;
}
.dot {
  display:inline-block;
  width:8px;height:8px;
  border-radius:50%;
  background:#ff3333;
  margin-right:6px;
  animation:blink 1s infinite;
}
@keyframes blink {50%{opacity:.2}}
.events {
  display:flex;
  justify-content:center;
  gap:15px;
  flex-wrap:wrap;
  padding:10px;
  font-size:12px;
  color:#ddd;
}
#admin {
  max-width:760px;
  margin:25px auto;
  padding:20px;
  border-radius:12px;
  background:white;
  color:#171717;
}
#admin h2 {margin-top:0}
.grid {
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}
label {font-size:12px;font-weight:bold}
input,select,button {
  width:100%;
  padding:11px;
  margin-top:5px;
  border:1px solid #ccc;
  border-radius:6px;
  font:inherit;
}
button {
  background:var(--red);
  color:white;
  border:0;
  font-weight:bold;
  cursor:pointer;
}
button.dark {background:#242630}
.buttons {
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:9px;
  margin-top:12px;
}
.hidden {display:none!important}
#message {font-size:13px;color:#555;margin-top:10px}
@media(max-width:500px) {
  .match {gap:5px;padding:18px 6px}
  .center {min-width:75px}
  .score {gap:7px}
  .grid {grid-template-columns:1fr 1fr}
}
body.overlay #admin {display:none}
body.overlay #overlay {margin:0;width:100%;border-radius:10px}
</style>
</head>
<body>

<div id="overlay">
  <div class="brand">
    <div class="shield">AF</div>
    ARSENAL FANS LIVE
  </div>
  <div class="competition" id="competition">INDEPENDENT FAN WATCH-ALONG</div>
  <div class="match">
    <div class="team">
      <div class="team-name" id="home">ARSENAL</div>
      <small>HOME</small>
    </div>
    <div class="center">
      <div class="score">
        <span id="hs">0</span>
        <span>:</span>
        <span id="as">0</span>
      </div>
      <div class="clock" id="clock">00:00</div>
      <div class="period" id="period">PRE-MATCH</div>
    </div>
    <div class="team">
      <div class="team-name" id="away">OPPONENT</div>
      <small>AWAY</small>
    </div>
  </div>
  <div class="events" id="events">MATCHDAY</div>
  <div class="bottom">
    <span><i class="dot"></i><span id="status">WATCH-ALONG</span></span>
    <span>ARSENAL FANS LIVE</span>
  </div>
</div>

<div id="admin">
  <h2>⚽ Match control dashboard</h2>
  <div id="login">
    <p>Administrator login</p>
    <input id="email" type="email" placeholder="Admin email">
    <input id="password" type="password" placeholder="Password">
    <button id="loginBtn">LOGIN</button>
  </div>

  <div id="controls" class="hidden">
    <div class="grid">
      <label>Competition
        <input id="compInput" value="INDEPENDENT FAN WATCH-ALONG">
      </label>
      <label>Match status
        <select id="periodInput">
          <option>PRE-MATCH</option>
          <option>1ST HALF</option>
          <option>HALF-TIME</option>
          <option>2ND HALF</option>
          <option>EXTRA TIME</option>
          <option>FULL-TIME</option>
          <option>PENALTIES</option>
        </select>
      </label>
      <label>Home team
        <input id="homeInput" value="ARSENAL">
      </label>
      <label>Away team
        <input id="awayInput" value="OPPONENT">
      </label>
      <label>Goal scorer
        <input id="scorer" placeholder="Player name">
      </label>
      <label>Manual added time
        <input id="added" placeholder="e.g. +5">
      </label>
    </div>

    <div class="buttons">
      <button id="homeGoal">HOME GOAL +1</button>
      <button id="awayGoal">AWAY GOAL +1</button>
      <button id="yellow">YELLOW CARD</button>
      <button id="red">RED CARD</button>
      <button id="start">START TIMER</button>
      <button class="dark" id="pause">PAUSE TIMER</button>
      <button class="dark" id="reset">RESET TIMER</button>
      <button class="dark" id="undo">UNDO LAST GOAL</button>
      <button id="save">SAVE TEAM / MATCH INFO</button>
      <button class="dark" id="logout">LOG OUT</button>
    </div>
    <p id="message">Connect your Firebase project to control the scoreboard.</p>
  </div>
</div>

<script type="module">
import { initializeApp } from
 "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";

import {
 getAuth, signInWithEmailAndPassword, signOut
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

import {
 getDatabase, ref, onValue, update, get
} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";

// 1. PUT YOUR FIREBASE CONFIGURATION HERE
const firebaseConfig = {
 apiKey: "YOUR_API_KEY",
 authDomain: "YOUR_PROJECT.firebaseapp.com",
 databaseURL: "https://YOUR_PROJECT-default-rtdb.firebaseio.com",
 projectId: "YOUR_PROJECT",
 appId: "YOUR_APP_ID"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
const matchRef = ref(db,"matches/arsenalfans");

const $ = id => document.getElementById(id);
const overlayMode =
 new URLSearchParams(location.search).get("overlay")==="1";

if(overlayMode) document.body.classList.add("overlay");

let state = {
 home:"ARSENAL", away:"OPPONENT",
 hs:0, as:0,
 competition:"INDEPENDENT FAN WATCH-ALONG",
 period:"PRE-MATCH",
 elapsed:0, startedAt:null,
 added:"", events:[]
};

function currentElapsed(s) {
 if(s.startedAt)
  return (s.elapsed||0)+Math.max(0,Math.floor((Date.now()-s.startedAt)/1000));
 return s.elapsed||0;
}

function timeString(seconds) {
 const m=Math.floor(seconds/60);
 const sec=seconds%60;
 return String(m).padStart(2,"0")+":"+String(sec).padStart(2,"0");
}

function render(s) {
 $("home").textContent=s.home;
 $("away").textContent=s.away;
 $("competition").textContent=s.competition;
 $("hs").textContent=s.hs;
 $("as").textContent=s.as;
 $("clock").textContent=timeString(currentElapsed(s))+
   (s.added ? " "+s.added : "");
 $("period").textContent=s.period;
 $("status").textContent=s.startedAt?"LIVE WATCH-ALONG":"WATCH-ALONG";
 $("events").textContent=(s.events||[]).slice(-4)
  .map(e=>e.icon+" "+e.text).join("  •  ") || "MATCHDAY";
}

function say(message) {
 $("message").textContent=message;
}

async function change(values) {
 if(!auth.currentUser) return say("Please log in first.");
 try {
  await update(matchRef,values);
  say("Scoreboard updated successfully.");
 } catch(e) {
  say("Update error: "+e.message);
 }
}

onValue(matchRef,snapshot=>{
 if(snapshot.exists()) {
  state=snapshot.val();
  render(state);
 }
});

setInterval(()=>render(state),500);

$("loginBtn").onclick=async()=>{
 try {
  await signInWithEmailAndPassword(
   auth,$("email").value,$("password").value
  );
  $("login").classList.add("hidden");
  $("controls").classList.remove("hidden");
  say("Administrator connected.");
 } catch(e) {
  say("Login failed: "+e.message);
 }
};

$("logout").onclick=async()=>{
 await signOut(auth);
 $("controls").classList.add("hidden");
 $("login").classList.remove("hidden");
};

$("save").onclick=()=>change({
 home:$("homeInput").value.toUpperCase(),
 away:$("awayInput").value.toUpperCase(),
 competition:$("compInput").value.toUpperCase(),
 period:$("periodInput").value,
 added:$("added").value
});

async function goal(team) {
 const s=state;
 const scorer=$("scorer").value.trim()||"Unknown scorer";
 const event={icon:"⚽",text:scorer+" ("+
  timeString(currentElapsed(s))+")"};
 const events=[...(s.events||[]),event].slice(-12);
 await change({
  [team]: (team==="hs" ? s.hs : s.as)+1,
  events
 });
 $("scorer").value="";
}

$("homeGoal").onclick=()=>goal("hs");
$("awayGoal").onclick=()=>goal("as");

async function card(icon,label) {
 const player=$("scorer").value.trim()||"Player";
 await change({
  events:[...(state.events||[]),
   {icon,text:label+": "+player}].slice(-12)
 });
}

$("yellow").onclick=()=>card("🟨","Yellow card");
$("red").onclick=()=>card("🟥","Red card");

$("start").onclick=()=>change({
 period:state.period==="PRE-MATCH"?"1ST HALF":state.period,
 startedAt:Date.now()
});

$("pause").onclick=()=>change({
 elapsed:currentElapsed(state),
 startedAt:null
});

$("reset").onclick=()=>change({
 elapsed:0,startedAt:null,period:"PRE-MATCH"
});

$("undo").onclick=async()=>{
 const s=state;
 const events=[...(s.events||[])];
 const last=events.pop();
 if(!last || last.icon!=="⚽")
  return say("Last event is not a goal.");
 // Goal events identify the scoring side by their stored team.
 const side=last.team;
 if(!side) return say("This event cannot be undone automatically.");
 await change({
  [side]:Math.max(0,s[side]-1),
  events
 });
};

</script>
</body>
</html>
